[project]
name = "portfolix"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arnav2407", email = "bhatnagararnav61@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.142.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "passlib>=1.7.4",
    "plotly>=5.20.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sqlalchemy>=2.1.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.54.0",
    "yfinance>=1.7.0",
]

[project.scripts]
portfolix = "portfolix:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
